[package]
name = "trex-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "trex"
path = "src/main.rs"

[dependencies]
trex-harness.workspace = true
trex-sandbox.workspace = true
trex-store.workspace = true

anyhow.workspace = true
axum.workspace = true
chrono = { workspace = true, features = ["clock"] }
dotenvy.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "net", "sync", "time"] }
tokio-util.workspace = true
tower-http = { workspace = true, features = ["trace", "request-id"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }
uuid.workspace = true
utoipa = { workspace = true, features = ["macros", "axum_extras", "preserve_order", "preserve_path_order"] }
utoipa-axum.workspace = true

[package]
name = "trex"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
openshell-sdk = { git = "https://github.com/NVIDIA/OpenShell", tag = "v0.1.2" }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "signal", "net"] }
tonic = { version = "0.14", features = ["tls-aws-lc"] }
tower-http = { version = "0.7.1", features = ["trace", "request-id"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

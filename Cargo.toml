[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/trex-server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
trex-harness = { path = "crates/trex-harness" }
trex-sandbox = { path = "crates/trex-sandbox" }
trex-store = { path = "crates/trex-store" }

anyhow = "1.0.104"
argon2 = "0.6.0"
async-openai = { version = "0.42.1", default-features = false }
axum = "0.8.9"
base64 = "0.22.1"
chrono = { version = "0.4.45", default-features = false }
chrono-tz = "0.10.4"
dotenvy = "0.15.7"
eventsource-stream = "0.2.3"
futures = "0.3"
getrandom = "0.4.3"
hyper = "1.11.1"
hyper-util = "0.1.21"
htmd = "0.5.5"
object_store = { version = "0.14.2", default-features = false }
pdf-extract = "0.12.1"
openshell-policy = { git = "https://github.com/NVIDIA/OpenShell", tag = "v0.1.2" }
openshell-sdk = { git = "https://github.com/NVIDIA/OpenShell", tag = "v0.1.2" }
croner = "4.0.1"
reqwest = { version = "0.13", default-features = false }
rust-embed = "8.12.0"
redis = { version = "1.7.1", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
similar = { version = "3.2.0", default-features = false, features = ["text"] }
tempfile = "3.27.0"
sqlx = { version = "0.9.0", default-features = false }
tar = "0.4.46"
tokio = "1.53.2"
tokio-util = "0.7"
toml = "1.1.6"
tonic = "0.14"
tower-http = "0.7.1"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
url = "2"
utoipa = { version = "6.0.0", default-features = false }
utoipa-axum = "0.3.0"
uuid = { version = "1.27.0", features = ["v7"] }
